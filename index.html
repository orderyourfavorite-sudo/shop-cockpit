<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Shop-Cockpit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#0b0d14; --bg2:#11141f; --karte:#161a28; --karte2:#1c2133; --rand:#262c42;
  --text:#eef0f7; --leise:#8b92ab; --leiser:#5d6480;
  --gold:#f5c451; --gruen:#3ddc97; --rot:#ff6b81; --blau:#5aa9ff; --lila:#a78bfa; --pink:#ff5fa2; --cyan:#25d0e0;
  --ale:#ff5fa2; --tho:#25d0e0;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(1200px 600px at 10% -10%,#1d1640 0%,transparent 60%),radial-gradient(900px 500px at 110% 0%,#0f2b3a 0%,transparent 55%),var(--bg);min-height:100vh}
.wrap{max-width:1680px;margin:0 auto;padding:20px 24px 40px}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.logo{display:flex;align-items:center;gap:12px}
.logo .punkt{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--pink),var(--cyan));display:grid;place-items:center;font-weight:800;font-size:18px;box-shadow:0 6px 24px #ff5fa244}
.logo h1{font-size:20px;margin:0;font-weight:800;letter-spacing:-.02em}
.logo small{display:block;color:var(--leise);font-size:12px;font-weight:500}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--gruen);font-weight:600;margin-left:6px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--gruen);box-shadow:0 0 0 0 #3ddc9788;animation:puls 2s infinite}
@keyframes puls{70%{box-shadow:0 0 0 10px #3ddc9700}100%{box-shadow:0 0 0 0 #3ddc9700}}
.spacer{flex:1}
.schalter{display:inline-flex;background:var(--bg2);border:1px solid var(--rand);border-radius:12px;padding:4px;gap:2px}
.schalter button{background:none;border:0;color:var(--leise);font:600 13px Inter,sans-serif;padding:8px 14px;border-radius:9px;cursor:pointer;white-space:nowrap}
.schalter button.an{background:var(--karte2);color:var(--text);box-shadow:inset 0 0 0 1px var(--rand)}
.schalter button:focus-visible{outline:2px solid var(--blau)}
.stand{color:var(--leiser);font-size:12px}

.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(5,1fr)}
.karte{background:linear-gradient(180deg,var(--karte),#141826);border:1px solid var(--rand);border-radius:18px;padding:18px 20px;position:relative;overflow:hidden}
.karte h3{margin:0 0 12px;font-size:13px;font-weight:600;color:var(--leise);text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:8px}
.kpi .wert{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .unter{margin-top:8px;font-size:13px;color:var(--leise);display:flex;gap:10px;flex-wrap:wrap}
.kpi .glow{position:absolute;inset:auto -40px -60px auto;width:160px;height:160px;border-radius:50%;filter:blur(50px);opacity:.25}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:#ffffff0d}
.pill.plus{color:var(--gruen);background:#3ddc9718}.pill.minus{color:var(--rot);background:#ff6b8118}
.konto-split{display:flex;gap:12px;font-size:12px;color:var(--leise)}
.konto-split b{color:var(--text);font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}

.kpis2{grid-template-columns:repeat(4,1fr)}
.mini{display:flex;align-items:center;gap:14px;padding:14px 18px}
.mini .ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none}
.mini span{display:block;font-size:12px;color:var(--leise);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.mini b{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.mini small{color:var(--leiser);font-size:12px;margin-left:6px}
.reihe2{grid-template-columns:1.25fr 2fr}
.reihe3{grid-template-columns:repeat(4,1fr)}
.reihe4{grid-template-columns:1fr 1fr 1.2fr}

/* Top-Tag */
.top{background:linear-gradient(160deg,#2a2211 0%,#1a1710 45%,#141826 100%);border-color:#5a4718}
.top h3{color:var(--gold)}
.top .krone{font-size:22px}
.top .datum{font-size:15px;color:#e8d6a3;font-weight:600;margin-bottom:14px}
.top .zahlen{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.top .zahlen div{background:#00000030;border:1px solid #5a471855;border-radius:12px;padding:12px}
.top .zahlen span{display:block;font-size:12px;color:#c9b88a;margin-bottom:4px}
.top .zahlen b{font-size:24px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums}
.ziel{margin-top:16px}
.ziel .txt{display:flex;justify-content:space-between;font-size:13px;color:#e8d6a3;margin-bottom:8px}
.balken{height:14px;background:#00000040;border-radius:99px;overflow:hidden;border:1px solid #5a471855}
.balken i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#f5c451,#ffdf8a);box-shadow:0 0 18px #f5c45188;transition:width 1s ease}
.je-konto{margin-top:16px;display:flex;flex-direction:column;gap:8px;font-size:13px;color:#c9b88a}
.je-konto div{display:flex;align-items:center;background:#00000025;border-radius:10px;padding:9px 12px}
.je-konto b{margin-left:auto;color:#fff;font-weight:600;font-variant-numeric:tabular-nums}
.ziel .hinweis{font-size:12px;color:#b9a77a;margin-top:8px}

.chart-box{position:relative;height:280px}
.chart-klein{position:relative;height:210px}

.kz .wert{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.kz .bar{height:6px;border-radius:99px;background:#ffffff10;margin-top:12px;overflow:hidden}
.kz .bar i{display:block;height:100%;border-radius:99px}
.kz .unter{font-size:12px;color:var(--leise);margin-top:8px}

.liste{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow:auto;padding-right:4px}
.liste::-webkit-scrollbar{width:6px}.liste::-webkit-scrollbar-thumb{background:var(--rand);border-radius:9px}
.eintrag{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--bg2);border:1px solid var(--rand);border-radius:12px;padding:10px 12px}
.eintrag .ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:16px}
.eintrag .t{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eintrag .s{font-size:12px;color:var(--leise);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eintrag .r{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.eintrag .r small{display:block;color:var(--leiser);font-weight:500;font-size:11px}
.eintrag.neu{animation:neu 2.5s ease}
@keyframes neu{0%{background:#3ddc9733;border-color:var(--gruen)}100%{}}
.leer{color:var(--leiser);font-size:13px;padding:20px 0;text-align:center}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--leiser);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:6px 8px;border-bottom:1px solid var(--rand)}
td{padding:9px 8px;border-bottom:1px solid #ffffff08;font-variant-numeric:tabular-nums}
td.n,th.n{text-align:right}
td .titel{max-width:340px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}

.toast{position:fixed;right:24px;bottom:24px;background:linear-gradient(135deg,#123d2c,#0f2a22);border:1px solid var(--gruen);color:#fff;border-radius:16px;padding:16px 20px;box-shadow:0 20px 60px #0008;transform:translateY(140%);transition:transform .5s cubic-bezier(.2,1.4,.4,1);z-index:9;max-width:380px}
.toast.zeigen{transform:none}
.toast b{display:block;font-size:18px;margin-bottom:4px}

#sperre{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:10}
#sperre[hidden]{display:none}
#sperre form{background:var(--karte);border:1px solid var(--rand);border-radius:18px;padding:28px;width:min(360px,90vw);display:flex;flex-direction:column;gap:12px}
#sperre input{background:var(--bg2);border:1px solid var(--rand);border-radius:10px;color:var(--text);padding:12px;font:15px Inter,sans-serif}
#sperre button{background:linear-gradient(135deg,var(--pink),var(--lila));border:0;border-radius:10px;color:#fff;font:700 15px Inter,sans-serif;padding:12px;cursor:pointer}
#sperre .fehler{color:var(--rot);font-size:13px;min-height:16px}

@media (max-width:1200px){.kpis{grid-template-columns:repeat(3,1fr)}.reihe2,.reihe4{grid-template-columns:1fr}.reihe3{grid-template-columns:repeat(2,1fr)}}
@media (max-width:640px){.kpis2{grid-template-columns:1fr 1fr}.wrap{padding:14px 16px 30px}.kpis{grid-template-columns:1fr 1fr}.reihe3{grid-template-columns:1fr 1fr}.kpi .wert{font-size:26px}.top .zahlen b{font-size:18px}header .spacer{display:none}}
</style>
</head>
<body>
<div id="sperre" hidden>
  <form id="sperreForm">
    <div class="logo"><div class="punkt">€</div><h1>Shop-Cockpit</h1></div>
    <input id="pw" type="password" placeholder="Passwort" autocomplete="current-password" autofocus>
    <label style="font-size:13px;color:var(--leise)"><input type="checkbox" id="merken" checked> Auf diesem Gerät merken</label>
    <button>Öffnen</button>
    <div class="fehler" id="pwFehler"></div>
  </form>
</div>

<div class="wrap">
  <header>
    <div class="logo"><div class="punkt">€</div><div><h1>Shop-Cockpit <span class="live"><i></i>LIVE</span></h1><small id="stand">lädt …</small></div></div>
    <div class="spacer"></div>
    <div class="schalter" id="zeitraum">
      <button data-z="heute">Heute</button><button data-z="gestern">Gestern</button><button data-z="7">7 Tage</button><button data-z="30">30 Tage</button>
    </div>
    <div class="schalter" id="konto">
      <button data-k="alle">Beide</button><button data-k="alessandra">Alessandra</button><button data-k="thomas">Thomas</button>
    </div>
  </header>

  <section class="grid kpis" id="kpis"></section>
  <section class="grid kpis2" id="kpis2" style="margin-top:16px"></section>

  <section class="grid reihe2" style="margin-top:16px">
    <div class="karte top" id="top"></div>
    <div class="karte"><h3>Umsatz & Aufrufe je Tag</h3><div class="chart-box"><canvas id="cTage"></canvas></div></div>
  </section>

  <section class="grid reihe3" style="margin-top:16px" id="kennzahlen"></section>

  <section class="grid reihe4" style="margin-top:16px">
    <div class="karte"><h3>Woher die Aufrufe kommen</h3><div class="chart-klein"><canvas id="cTraffic"></canvas></div></div>
    <div class="karte"><h3>Verkäufe nach Videoalter</h3><div class="chart-klein"><canvas id="cAlter"></canvas></div><div class="stand" id="alterTxt" style="margin-top:8px"></div></div>
    <div class="karte"><h3>Live vom Handy</h3><div class="liste" id="feed"></div></div>
  </section>

  <section class="grid" style="margin-top:16px;grid-template-columns:1.6fr 1fr">
    <div class="karte"><h3>Beste Videos im Zeitraum</h3><div style="overflow:auto"><table id="topVideos"></table></div></div>
    <div class="karte"><h3>Kooperationen & Angebote</h3><div class="liste" id="koop"></div></div>
  </section>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const FARBE = {alessandra:getComputedStyle(document.documentElement).getPropertyValue('--ale').trim(), thomas:getComputedStyle(document.documentElement).getPropertyValue('--tho').trim()};
const NAME = {alessandra:'Alessandra', thomas:'Thomas'};
const KONTEN = ['alessandra','thomas'];
const AKTUALISIEREN_MS = 120000;
let D = null, zr = lies('zr','heute'), kt = lies('kt','alle'), charts = {}, bekannte = null;

function lies(k,s){try{return localStorage.getItem('sc_'+k)||s}catch(e){return s}}
function schreib(k,v){try{localStorage.setItem('sc_'+k,v)}catch(e){}}
const eur = v => v==null||isNaN(v) ? '–' : v.toLocaleString('de-DE',{style:'currency',currency:'EUR'});
const zahl = v => v==null||isNaN(v) ? '–' : Math.round(v).toLocaleString('de-DE');
const pct = (v,n=1) => v==null||isNaN(v) ? '–' : v.toLocaleString('de-DE',{maximumFractionDigits:n})+' %';
const iso = d => d.toLocaleDateString('sv-SE');
const tagLang = s => new Date(s+'T12:00').toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const tagKurz = s => new Date(s+'T12:00').toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'});
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const kurz = (t,n=46) => { t=String(t??'').split(/\s[–—|-]\s/)[0].trim(); return t.length<=n?t:t.slice(0,n).replace(/\s\S*$/,'')+'…'; };
const kontoOk = k => kt==='alle' || k===kt;
const summe = (a,f) => { let s=0,n=0; for(const x of a){const v=f(x); if(v!=null&&!isNaN(v)){s+=v;n++}} return n?s:null; };

/* ---------- Zeitraum ---------- */
function bereich(z){
  const h = new Date(); h.setHours(12,0,0,0);
  const heute = iso(h); const g = new Date(h); g.setDate(g.getDate()-1);
  if(z==='heute') return {von:heute,bis:heute,tage:1,name:'Heute'};
  if(z==='gestern') return {von:iso(g),bis:iso(g),tage:1,name:'Gestern'};
  const n = +z; const v = new Date(h); v.setDate(v.getDate()-n+1);
  return {von:iso(v),bis:heute,tage:n,name:`Letzte ${n} Tage`};
}
function vorBereich(b){
  const v = new Date(b.von+'T12:00'); const e = new Date(v); e.setDate(e.getDate()-1);
  const a = new Date(e); a.setDate(a.getDate()-b.tage+1);
  return {von:iso(a),bis:iso(e),tage:b.tage};
}
const inB = (d,b) => d>=b.von && d<=b.bis;

/* ---------- Werte je Tag (inkl. Live-Umsatz für heute) ---------- */
function liveHeute(konto){
  const heute = iso(new Date());
  const l = D.umsatz_live.filter(e=>e.konto===konto && e.zeit.slice(0,10)===heute);
  return l.length ? l[l.length-1] : null;
}
function tagWerte(){
  // {datum: {konto: {gmv,artikel,provision,views,follower}}}
  const m = {};
  for(const t of D.tage){ (m[t.datum] ??= {})[t.konto] = {gmv:t.gmv,artikel:t.artikel,provision:t.provision,klicks:t.klicks,views:t.views,follower:t.follower,status:t.verkauf_status}; }
  // Live-Stände (letzter Stand je Tag) füllen Tage ohne Endstand
  const letzte = {};
  for(const e of D.umsatz_live){ letzte[e.zeit.slice(0,10)+'|'+e.konto] = e; }
  for(const [k,e] of Object.entries(letzte)){
    const [d,konto] = k.split('|'); const w = ((m[d] ??= {})[konto] ??= {});
    if(w.gmv==null){ w.gmv=e.gmv; w.artikel=e.artikel; w.live=e.zeit; }
  }
  return m;
}
function kennzahl(b, feld, tw){
  let s=null;
  for(const [d,ks] of Object.entries(tw)){ if(!inB(d,b)) continue;
    for(const [k,w] of Object.entries(ks)){ if(!kontoOk(k)) continue; const v=w[feld]; if(v!=null){s=(s||0)+v} } }
  return s;
}
function followerZuwachs(b){
  let ges=null;
  for(const k of KONTEN){ if(!kontoOk(k)) continue;
    const f = D.handy.filter(e=>e.konto===k && e.art==='follower' && e.anzahl!=null).sort((a,c)=>a.zeit<c.zeit?-1:1);
    const ende = [...f].reverse().find(e=>e.zeit.slice(0,10)<=b.bis);
    const start = [...f].reverse().find(e=>e.zeit.slice(0,10)<b.von);
    if(ende && start){ ges=(ges||0)+(ende.anzahl-start.anzahl); }
    else{ // Ersatz: neue Follower aus Videos im Zeitraum
      const v = summe(D.videos.filter(x=>x.konto===k && inB(x.datum,b)), x=>x.neue_follower);
      if(v!=null) ges=(ges||0)+v;
    }
  }
  return ges;
}

/* ---------- Zeichnen ---------- */
function veraenderung(jetzt, vorher){
  if(jetzt==null||vorher==null||vorher===0) return '';
  const p = (jetzt-vorher)/Math.abs(vorher)*100;
  return `<span class="pill ${p>=0?'plus':'minus'}">${p>=0?'▲':'▼'} ${Math.abs(p).toLocaleString('de-DE',{maximumFractionDigits:0})} %</span>`;
}
function proKonto(b, feld, tw){
  if(kt!=='alle') return '';
  return `<span class="konto-split">${KONTEN.map(k=>{let s=null; for(const [d,ks] of Object.entries(tw)){ if(inB(d,b)&&ks[k]&&ks[k][feld]!=null) s=(s||0)+ks[k][feld]; }
    return `<span><span class="dot" style="background:${FARBE[k]}"></span>${NAME[k]} <b>${feld==='gmv'||feld==='provision'?eur(s):zahl(s)}</b></span>`}).join('')}</span>`;
}
function kpis(b, tw){
  const vb = vorBereich(b);
  const k = [
    {t:'Umsatz (GMV)', f:'gmv', fmt:eur, farbe:'var(--gruen)'},
    {t:'Provision', f:'provision', fmt:eur, farbe:'var(--gold)'},
    {t:'Verkaufte Artikel', f:'artikel', fmt:zahl, farbe:'var(--pink)'},
    {t:'Neue Aufrufe', f:'views', fmt:zahl, farbe:'var(--blau)'},
  ];
  let html = k.map(x=>{ const v=kennzahl(b,x.f,tw), vv=kennzahl(vb,x.f,tw);
    return `<div class="karte kpi"><div class="glow" style="background:${x.farbe}"></div><h3>${x.t}</h3><div class="wert">${x.fmt(v)}</div>
      <div class="unter">${veraenderung(v,vv)}${vv!=null?`<span>vorher ${x.fmt(vv)}</span>`:''}</div><div class="unter">${proKonto(b,x.f,tw)}</div></div>`}).join('');
  // Provision: wie viele Umsatz-Tage haben schon eine Provision?
  let mitU=0, mitP=0; for(const [d,ks] of Object.entries(tw)){ if(!inB(d,b)) continue; for(const [k,w] of Object.entries(ks)){ if(kontoOk(k)&&w.gmv){ mitU++; if(w.provision!=null) mitP++; } } }
  if(mitU && mitP<mitU) html = html.replace('<h3>Provision</h3>', `<h3>Provision</h3><div class="stand" style="position:absolute;top:18px;right:20px">erfasst ${mitP}/${mitU} Tage</div>`);
  const f = followerZuwachs(b), fv = followerZuwachs(vb);
  html += `<div class="karte kpi"><div class="glow" style="background:var(--lila)"></div><h3>Neue Follower</h3><div class="wert">${f==null?'–':(f>=0?'+':'')+zahl(f)}</div>
    <div class="unter">${veraenderung(f,fv)}${fv!=null?`<span>vorher ${zahl(fv)}</span>`:''}</div></div>`;
  document.getElementById('kpis').innerHTML = html;
}
function kpis2(b, tw){
  const v = D.videos.filter(x=>kontoOk(x.konto) && inB(x.datum,b) && !x.geplant);
  const kl = kennzahl(b,'klicks',tw), sk = kennzahl(b,'gmv',tw);
  const m = [
    {i:'👆',t:'Produktklicks',w:kl,f:'#25d0e0',z:kl&&kennzahl(b,'artikel',tw)?`${(kennzahl(b,'artikel',tw)/kl*100).toLocaleString('de-DE',{maximumFractionDigits:1})} % kaufen`:''},
    {i:'❤️',t:'Likes',w:summe(v,x=>x.likes),f:'#ff5fa2',z:'auf Videos im Zeitraum'},
    {i:'💬',t:'Kommentare',w:summe(v,x=>x.kommentare),f:'#a78bfa',z:''},
    {i:'↗️',t:'Shares',w:summe(v,x=>x.shares),f:'#f5c451',z:`${zahl(summe(v,x=>x.gespeichert))} gespeichert`},
  ];
  document.getElementById('kpis2').innerHTML = m.map(x=>`<div class="karte mini"><div class="ico" style="background:${x.f}22">${x.i}</div><div><span>${x.t}</span><b>${zahl(x.w)}</b><small>${x.z}</small></div></div>`).join('');
}
function topTag(tw){
  let best=null;
  for(const [d,ks] of Object.entries(tw)){
    let g=0,a=0,p=null,da=false;
    for(const [k,w] of Object.entries(ks)){ if(!kontoOk(k)||w.gmv==null) continue; da=true; g+=w.gmv; a+=w.artikel||0; if(w.provision!=null)p=(p||0)+w.provision; }
    if(da && (!best || g>best.gmv)) best={datum:d,gmv:g,artikel:a,provision:p};
  }
  const heute = iso(new Date());
  let hg=0; for(const k of KONTEN){ if(kontoOk(k)){ const l=liveHeute(k); if(l) hg+=l.gmv; } }
  const el = document.getElementById('top');
  if(!best){ el.innerHTML='<h3><span class="krone">👑</span> Top-Tag</h3><div class="leer">Noch keine Verkaufsdaten</div>'; return; }
  const anteil = Math.min(100, best.gmv? hg/best.gmv*100 : 0);
  const rekord = best.datum===heute;
  el.innerHTML = `<h3><span class="krone">👑</span> Top-Tag – das Ziel</h3>
    <div class="datum">${tagLang(best.datum)}</div>
    <div class="zahlen"><div><span>GMV</span><b>${eur(best.gmv)}</b></div><div><span>Provision</span><b>${eur(best.provision)}</b></div><div><span>Verkäufe</span><b>${zahl(best.artikel)}</b></div></div>
    <div class="ziel"><div class="txt"><span>Heute: <b>${eur(hg)}</b></span><span>${rekord?'🎉 Neuer Rekord!':'noch '+eur(Math.max(0,best.gmv-hg))+' bis zum Rekord'}</span></div>
    <div class="balken"><i style="width:${anteil.toFixed(1)}%"></i></div>
    <div class="hinweis">${anteil.toLocaleString('de-DE',{maximumFractionDigits:0})} % vom besten Tag geschafft</div></div>
    <div class="je-konto">${KONTEN.filter(kontoOk).map(k=>{ let bk=null; for(const [d,ks] of Object.entries(tw)){ const w=ks[k]; if(w&&w.gmv!=null&&(!bk||w.gmv>bk.gmv)) bk={d,...w}; }
      return `<div><span class="dot" style="background:${FARBE[k]}"></span>Bester Tag ${NAME[k]}<b>${bk?eur(bk.gmv)+' · '+zahl(bk.artikel)+' Art. · '+tagKurz(bk.d):'–'}</b></div>`}).join('')}</div>`;
}
function tageChart(b, tw){
  const n = Math.max(b.tage, 14); const ende = new Date(b.bis+'T12:00'); const tage=[];
  for(let i=n-1;i>=0;i--){ const d=new Date(ende); d.setDate(d.getDate()-i); tage.push(iso(d)); }
  const ds = KONTEN.filter(kontoOk).map(k=>({type:'bar',label:'Umsatz '+NAME[k],data:tage.map(d=>tw[d]?.[k]?.gmv??null),backgroundColor:FARBE[k]+'cc',borderRadius:6,stack:'g',yAxisID:'y'}));
  ds.push({type:'line',label:'Aufrufe',data:tage.map(d=>{let s=null; for(const k of KONTEN){ if(kontoOk(k)&&tw[d]?.[k]?.views!=null) s=(s||0)+tw[d][k].views } return s}),
    borderColor:'#5aa9ff',backgroundColor:'#5aa9ff22',fill:true,tension:.35,pointRadius:0,borderWidth:2,yAxisID:'y2',spanGaps:true});
  zeichne('cTage',{data:{labels:tage.map(tagKurz),datasets:ds},options:{
    scales:{x:{stacked:true,grid:{display:false}},y:{stacked:true,ticks:{callback:v=>v+' €'}},y2:{position:'right',grid:{display:false},ticks:{callback:v=>v>=1000?(v/1000)+'k':v}}},
    plugins:{tooltip:{callbacks:{label:c=>c.dataset.label+': '+(c.dataset.yAxisID==='y'?eur(c.raw):zahl(c.raw))}}}}});
}
function kennzahlen(b){
  const v = D.videos.filter(x=>kontoOk(x.konto) && inB(x.datum,b) && !x.geplant);
  const mitW = v.filter(x=>x.wiedergabe_s!=null && x.views);
  const gew = (f) => { let s=0,n=0; for(const x of mitW){ if(x[f]!=null){s+=x[f]*x.views;n+=x.views} } return n?s/n:null; };
  const views = summe(v,x=>x.views)||0;
  const inter = views ? (summe(v,x=>(x.likes||0)+(x.kommentare||0)+(x.shares||0))||0)/views*100 : null;
  const k = [
    {t:'Ø Watchtime', w:gew('wiedergabe_s'), fmt:x=>x==null?'–':x.toLocaleString('de-DE',{maximumFractionDigits:1})+' s', max:15, farbe:'var(--blau)', u:'pro Aufruf'},
    {t:'Abschlussrate', w:gew('ganz_pct'), fmt:pct, max:30, farbe:'var(--gruen)', u:'Videos ganz gesehen'},
    {t:'Interaktionsrate', w:inter, fmt:x=>pct(x,2), max:10, farbe:'var(--pink)', u:'Likes + Kommentare + Shares'},
    {t:'Videos gepostet', w:v.length, fmt:zahl, max:Math.max(25*b.tage*(kt==='alle'?1.12:1),1), farbe:'var(--lila)', u:`${zahl(views)} Aufrufe auf diesen Videos`},
  ];
  document.getElementById('kennzahlen').innerHTML = k.map(x=>`<div class="karte kz"><h3>${x.t}</h3><div class="wert">${x.fmt(x.w)}</div>
    <div class="bar"><i style="width:${x.w==null?0:Math.min(100,x.w/x.max*100)}%;background:${x.farbe}"></i></div><div class="unter">${x.u}${mitW.length||x.t==='Videos gepostet'?'':' · noch keine Detaildaten'}</div></div>`).join('');
}
function traffic(b){
  const ids = new Set(D.videos.filter(x=>kontoOk(x.konto)&&inB(x.datum,b)).map(x=>x.id));
  const s = {}; for(const t of D.traffic){ if(ids.has(t.video_id)) s[t.quelle]=(s[t.quelle]||0)+t.views; }
  const e = Object.entries(s).filter(x=>x[1]>0).sort((a,c)=>c[1]-a[1]);
  const farben = ['#ff5fa2','#25d0e0','#a78bfa','#f5c451','#3ddc97','#5aa9ff','#8b92ab'];
  const ges = e.reduce((a,x)=>a+x[1],0);
  zeichne('cTraffic',{type:'doughnut',data:{labels:e.map(x=>x[0]),datasets:[{data:e.map(x=>x[1]),backgroundColor:farben,borderColor:'#161a28',borderWidth:3}]},
    options:{cutout:'62%',scales:{},plugins:{legend:{position:'right',labels:{boxWidth:10,generateLabels:c=>c.data.labels.map((l,i)=>({text:`${l}  ${(e[i][1]/ges*100).toLocaleString('de-DE',{maximumFractionDigits:1})} %`,fillStyle:farben[i],strokeStyle:farben[i],fontColor:'#c9cde0',index:i}))}},
      tooltip:{callbacks:{label:c=>`${c.label}: ${zahl(c.raw)} Aufrufe`}}}}});
}
function alter(b){
  const gr = ['Tag 0','1–2 Tage','3–7 Tage','8+ Tage']; const g={}, a={};
  for(const x of D.verkauf_alter){ if(kontoOk(x.konto)&&inB(x.tag,b)){ g[x.gruppe]=(g[x.gruppe]||0)+x.gmv; a[x.gruppe]=(a[x.gruppe]||0)+x.artikel; } }
  const ges = Object.values(g).reduce((s,x)=>s+x,0);
  zeichne('cAlter',{type:'bar',data:{labels:gr,datasets:[{label:'Umsatz',data:gr.map(x=>g[x]||0),backgroundColor:['#5aa9ff','#a78bfa','#ff5fa2','#f5c451'],borderRadius:8}]},
    options:{plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`${eur(c.raw)} · ${zahl(a[c.label]||0)} Artikel`}}},scales:{x:{grid:{display:false}},y:{ticks:{callback:v=>v+' €'}}}}});
  const alt = (g['3–7 Tage']||0)+(g['8+ Tage']||0);
  document.getElementById('alterTxt').textContent = ges ? `${(alt/ges*100).toFixed(0)} % des Umsatzes kam aus Videos, die 3 Tage oder älter sind.` : 'Keine Verkäufe mit Video-Zuordnung im Zeitraum.';
}
function feed(b){
  const l = D.handy.filter(e=>kontoOk(e.konto) && e.art==='verkauf').sort((a,c)=>a.zeit<c.zeit?1:-1).slice(0,30);
  const el = document.getElementById('feed');
  let live = '';
  for(const k of KONTEN){ if(!kontoOk(k)) continue; const s=liveHeute(k);
    live += `<div class="eintrag" style="border-color:${FARBE[k]}55"><div class="ico" style="background:${FARBE[k]}22">📱</div><div><div class="t">${NAME[k]} heute</div><div class="s">${s?'Stand '+s.zeit.slice(11,16)+' Uhr':'noch kein Stand'}</div></div><div class="r">${eur(s?.gmv)}<small>${s?zahl(s.artikel)+' Artikel':''}</small></div></div>`; }
  el.innerHTML = live + (l.length ? l.map(e=>`<div class="eintrag${bekannte&&!bekannte.has(e.zeit+e.titel)?' neu':''}"><div class="ico" style="background:${FARBE[e.konto]}22">🛍️</div>
    <div><div class="t" title="${esc(e.titel)}">${esc(kurz(e.titel))}</div><div class="s"><span class="dot" style="background:${FARBE[e.konto]}"></span>${NAME[e.konto]} · ${tagKurz(e.zeit.slice(0,10))} ${e.zeit.slice(11,16)}</div></div>
    <div class="r">+${eur(e.gmv)}<small>${zahl(e.artikel)} Art.</small></div></div>`).join('') : '<div class="leer">Noch keine Einzelverkäufe</div>');
}
function koop(){
  const l = D.handy.filter(e=>kontoOk(e.konto) && (e.art==='kooperation'||e.art==='angebot')).sort((a,c)=>a.zeit<c.zeit?1:-1).slice(0,12);
  document.getElementById('koop').innerHTML = l.length ? l.map(e=>`<div class="eintrag"><div class="ico" style="background:${e.art==='angebot'?'#f5c45122':'#a78bfa22'}">${e.art==='angebot'?'🏷️':'🤝'}</div>
    <div><div class="t">${esc(e.titel)}</div><div class="s">${e.art==='angebot'?'Angebot':'Kooperationsanfrage'}${(e.text||'').startsWith('(Agentur)')?' · Agentur':''}${e.produkte?' · '+esc(e.produkte):''}</div></div><div class="r"><small>${NAME[e.konto]}<br>${tagKurz(e.zeit.slice(0,10))}</small></div></div>`).join('') : '<div class="leer">Keine Anfragen</div>';
}
function topVideos(b){
  const v = D.videos.filter(x=>kontoOk(x.konto) && !x.geplant);
  // Verkäufe im Zeitraum je Video (verkauf_alter), sonst Aufrufe
  const vk = {}; for(const x of D.verkauf_alter){ if(kontoOk(x.konto)&&inB(x.tag,b)){ const k=x.konto+'|'+x.titel.slice(0,25); (vk[k] ??= {gmv:0,artikel:0,titel:x.titel,konto:x.konto,gepostet:x.gepostet}); vk[k].gmv+=x.gmv; vk[k].artikel+=x.artikel; } }
  let zeilen = Object.values(vk).sort((a,c)=>c.gmv-a.gmv).slice(0,8).map(x=>{
    const m = v.find(y=>y.konto===x.konto && (y.titel||'').slice(0,25)===x.titel.slice(0,25));
    return {titel:x.titel, konto:x.konto, gepostet:x.gepostet, gmv:x.gmv, artikel:x.artikel, views:m?.views, w:m?.wiedergabe_s};
  });
  let kopf = 'Umsatz';
  if(!zeilen.length){ kopf='Aufrufe';
    zeilen = v.filter(x=>inB(x.datum,b)).sort((a,c)=>(c.views||0)-(a.views||0)).slice(0,8).map(x=>({titel:x.titel,konto:x.konto,gepostet:x.datum,gmv:x.gmv,artikel:x.artikel,views:x.views,w:x.wiedergabe_s})); }
  document.getElementById('topVideos').innerHTML = `<tr><th>Video</th><th>Konto</th><th>Gepostet</th><th class="n">Umsatz</th><th class="n">Artikel</th><th class="n">Aufrufe</th><th class="n">Watchtime</th></tr>` +
    (zeilen.length ? zeilen.map(x=>`<tr><td><span class="titel" title="${esc(x.titel)}">${esc(x.titel)}</span></td><td><span class="dot" style="background:${FARBE[x.konto]}"></span>${NAME[x.konto]}</td><td>${tagKurz(String(x.gepostet).slice(0,10))}</td>
      <td class="n">${eur(x.gmv)}</td><td class="n">${zahl(x.artikel)}</td><td class="n">${zahl(x.views)}</td><td class="n">${x.w==null?'–':x.w.toLocaleString('de-DE',{maximumFractionDigits:1})+' s'}</td></tr>`).join('')
     : '<tr><td colspan="7" class="leer">Keine Videos im Zeitraum</td></tr>');
}
function zeichne(id, cfg){
  cfg.type ??= 'bar';
  cfg.options = Object.assign({responsive:true,maintainAspectRatio:false,animation:{duration:600},interaction:{mode:'index',intersect:false}}, cfg.options);
  if(charts[id]){ charts[id].destroy(); }
  charts[id] = new Chart(document.getElementById(id), cfg);
}
function alles(){
  if(!D) return;
  const b = bereich(zr), tw = tagWerte();
  document.querySelectorAll('#zeitraum button').forEach(x=>x.classList.toggle('an',x.dataset.z===zr));
  document.querySelectorAll('#konto button').forEach(x=>x.classList.toggle('an',x.dataset.k===kt));
  document.getElementById('stand').textContent = `${b.name} · Daten vom ${D.stand.erzeugt} · aktualisiert sich alle 2 Min.`;
  kpis(b,tw); kpis2(b,tw); topTag(tw); tageChart(b,tw); kennzahlen(b); traffic(b); alter(b); feed(b); koop(); topVideos(b);
}

/* ---------- Laden (verschlüsselt online, offen lokal) ---------- */
const b64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
async function schluessel(pw, salt){
  const roh = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'}, roh, {name:'AES-GCM',length:256}, true, ['decrypt']);
}
let KEY = null;
async function entschluesseln(p){
  if(!KEY){
    const gemerkt = lies('key','');
    if(gemerkt){ KEY = await crypto.subtle.importKey('raw', b64(gemerkt), 'AES-GCM', true, ['decrypt']); }
    else{ KEY = await passwortFragen(b64(p.salt)); }
  }
  const klar = await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(p.iv)}, KEY, b64(p.daten));
  return JSON.parse(new TextDecoder().decode(klar));
}
function passwortFragen(salt){
  return new Promise(ok=>{
    const s = document.getElementById('sperre'); s.hidden = false;
    document.getElementById('sperreForm').onsubmit = async ev=>{
      ev.preventDefault();
      const k = await schluessel(document.getElementById('pw').value, salt);
      try{ await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(window._p.iv)}, k, b64(window._p.daten)); }
      catch(e){ document.getElementById('pwFehler').textContent='Passwort falsch'; return; }
      if(document.getElementById('merken').checked){ const r = new Uint8Array(await crypto.subtle.exportKey('raw',k)); schreib('key', btoa(String.fromCharCode(...r))); }
      s.hidden = true; ok(k);
    };
  });
}
function toast(neu){
  const t = document.getElementById('toast');
  const g = neu.reduce((s,e)=>s+(e.gmv||0),0);
  t.innerHTML = `<b>💰 Neuer Verkauf! +${eur(g)}</b>${neu.slice(0,3).map(e=>esc(NAME[e.konto]+': '+e.titel.slice(0,40))).join('<br>')}`;
  t.classList.add('zeigen'); setTimeout(()=>t.classList.remove('zeigen'), 12000);
}
async function laden(){
  try{
    let neu;
    const r = await fetch('daten.enc.json?'+Date.now(), {cache:'no-store'});
    if(r.ok){ window._p = await r.json(); neu = await entschluesseln(window._p); }
    else{ neu = await (await fetch('daten.json?'+Date.now(), {cache:'no-store'})).json(); }
    const ids = new Set(neu.handy.filter(e=>e.art==='verkauf').map(e=>e.zeit+e.titel));
    const frisch = bekannte ? neu.handy.filter(e=>e.art==='verkauf' && !bekannte.has(e.zeit+e.titel)) : [];
    D = neu; alles(); bekannte = ids;
    if(frisch.length) toast(frisch);
  }catch(e){
    if(String(e).includes('OperationError')){ schreib('key',''); KEY=null; }
    document.getElementById('stand').textContent = 'Daten konnten nicht geladen werden – nächster Versuch in 2 Min.';
    console.error(e);
  }
}

Chart.defaults.color = '#8b92ab'; Chart.defaults.font.family = 'Inter, system-ui, sans-serif';
Chart.defaults.borderColor = '#ffffff0d'; Chart.defaults.plugins.legend.labels.boxWidth = 10;
document.getElementById('zeitraum').onclick = e=>{ if(e.target.dataset.z){ zr=e.target.dataset.z; schreib('zr',zr); alles(); } };
document.getElementById('konto').onclick = e=>{ if(e.target.dataset.k){ kt=e.target.dataset.k; schreib('kt',kt); alles(); } };
laden(); setInterval(laden, AKTUALISIEREN_MS);
setInterval(()=>{ if(D) topTag(tagWerte()); }, 60000);
</script>
